apply plugin: 'com.android.application'

// Restock's own signing key, kept outside the project (see BUILD.md, "Restock's signing key").
// When it's there, release builds are signed with it, so updates install over each other on any
// computer. Without it, they use this computer's debug key as before. 0.9.0: debug builds always
// use this computer's debug key (they're a separate app, see buildTypes below).
def signingFile = new File(System.getProperty('user.home'), '.restock/signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

// 0.9.0: say so when a release build is about to be signed without Restock's key (a home build).
// Only for release builds, so a debug build doesn't print it.
gradle.taskGraph.whenReady { graph ->
    if (!signingFile.exists() && (graph.hasTask(project.path + ':packageRelease') || graph.hasTask(project.path + ':bundleRelease'))) {
        logger.warn("Release build signed with this computer's debug key: it won't install over official Restock")
    }
}

android {
    namespace = "family.plenty.restock"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "family.plenty.restock"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 112
        versionName "0.17.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 0.15.1: two versions of the same app (one applicationId: one or the other is on a phone).
    // - github: the APK on GitHub and in Restock's own F-Droid repo. It checks for updates and
    //   installs them itself (you tap Install), and asks Android to let it sync in the background.
    // - play: the App Bundle for Google Play (not published there yet). Google Play updates it, so it
    //   has no updater and not the permission to install apps; the background question is
    //   Android's own battery list instead (Play's rules). Nothing from Google is added to either.
    buildFeatures {
        buildConfig true
    }
    flavorDimensions = ["channel"]
    productFlavors {
        github {
            dimension "channel"
            buildConfigField "boolean", "SELF_UPDATE", "true"
            buildConfigField "String", "CHANNEL", '"github"'
        }
        play {
            dimension "channel"
            buildConfigField "boolean", "SELF_UPDATE", "false"
            buildConfigField "String", "CHANNEL", '"play"'
        }
    }
    signingConfigs {
        if (signingFile.exists()) {
            restock {
                storeFile new File(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // 0.9.0: a debug build is its own app (family.plenty.restock.debug, version "0.9.0-debug"),
            // signed with this computer's debug key, so it can never install over the real Restock
            // or be mistaken for it. Android shows it as a second Restock.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // 0.9.0: official APKs are release builds (not debuggable, so a computer can't copy
            // Restock's database off the phone). Code shrinking stays off so nothing the plugins
            // or the shops' pages need is removed. Without Restock's key, this computer's debug
            // key signs it, so a home build still installs.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 0.15.1: RESTOCK_UNSIGNED (the release workflow's Google Play bundle): no key at all.
            signingConfig signingFile.exists() ? signingConfigs.restock : (System.getenv('RESTOCK_UNSIGNED') ? null : signingConfigs.debug)
        }
    }
    lint {
        // Lint's release check shouldn't stop a build on someone else's computer.
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Background price checks on Android's own scheduler (AndroidX — not Google Play services).
    implementation "androidx.work:work-runtime:2.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Firebase / Google services: this app doesn't use Google Play services.
