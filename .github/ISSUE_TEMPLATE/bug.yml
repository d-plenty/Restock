name: Bug
description: Something in the app doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please leave out loyalty card numbers, backup files and anything else personal.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open Pantry
        2. Tap ...
  - type: input
    id: version
    attributes:
      label: Restock version
      description: Settings, at the very bottom.
      placeholder: 0.7.6
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or logs
      description: Drag images in here. Crop out anything private.
